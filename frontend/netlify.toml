[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/token"
  to = "/.netlify/functions/token"
  status = 200

[[redirects]]
  from = "/api/captions/contextualize"
  to = "/.netlify/functions/captions-contextualize"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
